name: Module checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m bandit -r sample_excel_sync -ll
      - run: python -m pip_audit -r requirements.txt
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-excel-sync-candidate
          path: dist/sample_excel_sync.zip
  odoo19-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ci/Dockerfile -t sample-excel-tests .
      - name: Install and test in disposable Odoo 19
        run: |
          docker run --rm --network host \
            -v "$PWD/sample_excel_sync:/mnt/addons/sample_excel_sync:ro" \
            -v "$PWD/ci/fixtures/sample_management_mlx:/mnt/addons/sample_management_mlx:ro" \
            sample-excel-tests odoo \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --database=sample_excel_ci --addons-path=/mnt/addons,/usr/lib/python3/dist-packages/odoo/addons \
            --init=sample_excel_sync --test-tags=/sample_excel_sync --stop-after-init \
            --without-demo=all --data-dir=/tmp/odoo --http-interface=127.0.0.1 --log-level=test
